name: Build AutoClipper Zero and capture desktop demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoclipper-zero-demo
  cancel-in-progress: false

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          }
          ffmpeg -version
          ffprobe -version

      - name: Install application and screenshot dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyautogui pygetwindow pillow
          python -c "import tkinter, numpy, faster_whisper, streamlink, yt_dlp, pyautogui, pygetwindow; print('All application and GUI imports passed')"

      - name: Launch the real Windows desktop application
        shell: pwsh
        run: |
          $app = Start-Process -FilePath python -ArgumentList "autoclipperzero.py" -WorkingDirectory "$env:GITHUB_WORKSPACE" -PassThru
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            $check = python -c "import pygetwindow as gw; print('READY' if gw.getWindowsWithTitle('AutoclipperZero') else 'WAIT')"
            if ($check -match "READY") { $ready = $true; break }
            if ($app.HasExited) { throw "AutoClipper Zero exited before its window appeared (exit $($app.ExitCode))." }
          }
          if (-not $ready) { throw "Timed out waiting for the AutoClipper Zero desktop window." }

      - name: Capture the actual application window
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "docs/assets" | Out-Null
          @'
          import time
          import pyautogui
          import pygetwindow as gw

          windows = gw.getWindowsWithTitle("AutoclipperZero")
          if not windows:
              raise SystemExit("AutoClipper Zero window was not found.")
          window = windows[0]
          if window.isMinimized:
              window.restore()
          window.activate()
          window.maximize()
          time.sleep(3)
          image = pyautogui.screenshot()
          image.save("docs/assets/autoclipper-zero-desktop.png")
          print(f"Captured real desktop screenshot: {image.size}")
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\capture.py"
          python "$env:RUNNER_TEMP\capture.py"
          if (-not (Test-Path "docs/assets/autoclipper-zero-desktop.png")) { throw "Screenshot was not created." }

      - name: Stop the temporary desktop app
        if: always()
        shell: pwsh
        run: |
          Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*\Python312\*" } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Commit the genuine desktop screenshot
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          $existing = git ls-tree -r --name-only origin/main docs/assets/autoclipper-zero-desktop.png
          if ($existing -eq "docs/assets/autoclipper-zero-desktop.png") {
            git checkout origin/main -- docs/assets/autoclipper-zero-desktop.png
            Write-Host "A genuine desktop screenshot is already committed; no duplicate commit is needed."
          } else {
            git add docs/assets/autoclipper-zero-desktop.png
            git commit -m "Add screenshot of the running AutoClipper Zero desktop app"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit the screenshot." }
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw "Could not rebase screenshot commit onto latest main." }
            git push
            if ($LASTEXITCODE -ne 0) { throw "Could not push screenshot commit." }
          }
